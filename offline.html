<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>atworth — Offline</title>
  <style>
    html,body{height:100%;margin:0}
    body{
      display:flex;align-items:center;justify-content:center;
      background:linear-gradient(170deg,#0b2b24 0%,#07201a 45%,#041511 100%);
      color:#e2e8f0;font-family:'Inter',system-ui,Arial,sans-serif;text-align:center;padding:28px;
    }
    .wrap{max-width:380px}
    .ic{width:96px;height:96px;border-radius:28px;margin:0 auto 22px;display:flex;align-items:center;justify-content:center;
        background:rgba(0,201,167,0.15);color:#00c9a7}
    .ic svg{width:48px;height:48px}
    h1{font-size:26px;font-weight:800;margin:0 0 10px}
    p{font-size:16px;line-height:1.5;color:rgba(203,213,225,0.75);margin:0 0 24px}
    button{
      font-size:18px;font-weight:700;color:#04211a;cursor:pointer;border:none;
      background:linear-gradient(135deg,#00c9a7,#0acf83);padding:14px 28px;border-radius:14px;
      box-shadow:0 8px 22px rgba(0,201,167,0.35);
    }
    button:active{transform:scale(.96)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="ic">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>atworth needs an internet connection to load. Check your network and try again — your saved data is safe.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
