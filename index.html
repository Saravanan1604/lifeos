<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <meta name="description" content="Your AI-powered personal operating system for Finance, Health, Goals, Habits, Career and Life." />

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6889705040574527" crossorigin="anonymous"></script>

  <!-- ── PWA / Install ── -->
  <link rel="manifest" href="/manifest.json" />

<body>

<!-- Particle Background -->
<canvas id="particles-canvas"></canvas>

<!-- App Root -->
<div id="app">

  <!-- =================== AUTH SCREEN =================== -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-bg-orbs">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>
    <div class="auth-card glass-card">
      <div class="auth-logo">
        <div class="auth-logo-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </div>
        <h1 class="auth-title">LifeOS</h1>
        <p class="auth-subtitle">Your AI-Powered Life Operating System</p>
      </div>
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchAuthTab('login')" id="tab-login">Sign In</button>
        <button class="auth-tab" onclick="switchAuthTab('register')" id="tab-register">Create Account</button>
        <button class="auth-tab" onclick="switchAuthTab('forgot')" id="tab-forgot" style="font-size:12px;opacity:0.7">Forgot?</button>
      </div>

      <!-- Login Form -->
      <div id="login-form" class="auth-form">
        <div class="form-group"><label class="form-label">Email</label><input type="email" id="login-email" class="form-input" placeholder="you@example.com" /></div>
        <div class="form-group"><label class="form-label">Password</label><input type="password" id="login-password" class="form-input" placeholder="••••••••" /></div>
        <button class="btn-primary btn-full" onclick="handleLogin()"><span>Sign In</span> <span>→</span></button>
      </div>

      <!-- Register Form -->
      <div id="register-form" class="auth-form" style="display:none">
        <div class="form-group"><label class="form-label">Full Name</label><input type="text" id="reg-name" class="form-input" placeholder="Your name" /></div>
        <div class="form-group"><label class="form-label">Email</label><input type="email" id="reg-email" class="form-input" placeholder="you@example.com" /></div>
        <div class="form-group"><label class="form-label">Mobile Number</label><input type="tel" id="reg-mobile" class="form-input" placeholder="10-digit mobile number" /></div>
        <div class="form-group"><label class="form-label">Password</label><input type="password" id="reg-password" class="form-input" placeholder="••••••••" /></div>
        <button class="btn-primary btn-full" onclick="handleRegister()"><span>Create Account</span> <span>→</span></button>
      </div>

      <!-- Forgot Password Form -->
      <div id="forgot-form" class="auth-form" style="display:none">
        <p style="font-size:12px;color:var(--text2);margin-bottom:16px">Enter your Email and registered Mobile Number to reset.</p>
        <div class="form-group"><label class="form-label">Email</label><input type="email" id="forgot-email" class="form-input" placeholder="you@example.com" /></div>
        <div class="form-group"><label class="form-label">Mobile Number</label><input type="tel" id="forgot-mobile" class="form-input" placeholder="10-digit mobile number" /></div>
        <div class="form-group"><label class="form-label">New Password</label><input type="password" id="forgot-password" class="form-input" placeholder="Enter new password" /></div>
        <button class="btn-primary btn-full" onclick="handleForgotPassword()"><span>Reset Password</span> <span>→</span></button>
      </div>
    </div>
  </div>

  <!-- =================== MAIN APP =================== -->
  <div id="main-app" style="display:none">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">

          </span>
          <span class="sidebar-logo-text">LifeOS</span>
        </div>
        <button class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle sidebar">

            <span class="nav-text">Finance</span>
          </button>
          <button class="nav-item" onclick="navigate('investments')" data-page="investments">

          <button class="nav-item" onclick="navigate('goals')" data-page="goals">

      <h3 id="modal-title">Modal</h3>

</button>

<!-- Floating Calculator Window — outside app to avoid overflow clipping -->
<div id="calc-window" class="calc-window glass-card">

      <button class="calc-mode-btn active" data-mode="basic" onclick="switchCalcMode('basic')">Basic</button>
      <button class="calc-mode-btn" data-mode="scientific" onclick="switchCalcMode('scientific')">Sci</button>
      <button class="calc-mode-btn" data-mode="financial" onclick="switchCalcMode('financial')">Fin</button>

</div>

<!-- ── PWA Service Worker ── -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(r => console.log('SW registered:', r.scope))
        .catch(e => console.log('SW error:', e));
    });
  }

  // Handle ?page= shortcut links from PWA shortcuts
  (function(){
    const p = new URLSearchParams(location.search).get('page');
    if (p) window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => { if (typeof navigate === 'function') navigate(p); }, 300);
    });
  })();
</script>
