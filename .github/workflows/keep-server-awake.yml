# Keeps the free Render backend from sleeping, so sync doesn't wait ~1 minute
# for it to wake up. GitHub runs this about every 10 minutes (it can be late
# by a few minutes when GitHub is busy). Turn it off in the Actions tab.
name: Keep server awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the backend
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://lifeos-backend-mangodb.onrender.com/api/me || true)
          echo "Server answered with HTTP $code (401 is fine — it means the server is awake)"
